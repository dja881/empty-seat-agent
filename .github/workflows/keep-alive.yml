# Keeps the live demo awake while judges review it. Supabase pauses free projects after about
# a week without activity, so this reads the day report (read-only: it changes nothing in the
# demo) once a day, in the morning. If the site or the database stops answering, it opens a GitHub issue
# assigned to the repo owner, which GitHub emails to them.
name: Keep demo awake

on:
  schedule:
    # Scheduled for 03:07 IST so it lands between 7 and 9 am. GitHub started this check's morning
    # runs 4.6 to 5.1 hours late (15 to 17 Oct), which puts it at about 7:45 to 8:15 am IST. If
    # GitHub runs it on time, it simply happens at 3:07 am, still before 9 am.
    - cron: "37 21 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site and its database
        run: |
          set -e
          curl -fsS --max-time 30 https://empty-seat-agent.vercel.app/ -o /dev/null
          curl -fsS --max-time 30 https://empty-seat-agent.vercel.app/api/report | grep -q '"openUnits"'
          echo "Site and database answered."

      - name: Raise an alert if the check failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --assignee dja881 \
            --title "Live demo check failed $(date -u +'%d %b %H:%M') UTC" \
            --body "The twice-daily check could not load https://empty-seat-agent.vercel.app or its day report. Open the site to confirm. If the page loads with no data, the Supabase project has probably paused: restore it from the Supabase dashboard. Run details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
